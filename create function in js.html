<!DOCTYPE html>
<html>
    <head>
        <title>FUNCTION</title>
    </head>
    <body>
        <button onclick="myfunction(5,7)">execute JS functions</button>

        <script>
        function myfunction(x, y)
        {
            if (y===undefined){
                y = 2;
            }
            document.write(x*y);
        }
        </script>
    </body>
</html>
